name: Test and Build
on: push
jobs:
   test:
    runs-on: ubuntu-slim
    steps:
      - name: Getting code
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v6
        with:
            node-version: '22.15.1'
      - name: installing dependencies
        run: npm install
      - name: Testing app
        run: npm test    
        